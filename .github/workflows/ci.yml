name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck (both tsconfigs) → lint → format → tests + coverage ratchet → build → dist smoke test.
      # The large-network parity test runs here too: its data ships with the geojson-path-finder devDependency.
      - run: pnpm check
      - name: Package lint (publint + attw)
        if: matrix.node == 22
        run: pnpm check:package
      - name: Upload build
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  runtime:
    name: runtime · Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install on purpose: the package has no runtime dependencies, so the build must load on a bare Node.
      - run: node scripts/smoke-dist.mjs
